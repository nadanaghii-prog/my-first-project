<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Origami World</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  /* fonts: ../../fonts/fonts.css (Lalezar titles, Almarai small text) */
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { width: 1080px; height: 1920px; display: block; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<script>
// ------------------------------------------------------------
// Origami World — folded-paper look, every frame drawn in code.
// Each shape is made of flat facets (a lit side and a shaded side),
// pieces "unfold" into place along a crease, layers cast soft paper shadows.
// ------------------------------------------------------------
const W = 1080, H = 1920, DURATION = 10;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const outBack = x => { x = clamp(x); const c1 = 1.5, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const S = Math.sin, C = Math.cos, TAU = Math.PI * 2;

const poly = (pts, fill, extra = "") => `<polygon points="${pts.map(p => p.join(",")).join(" ")}" fill="${fill}" ${extra}/>`;
const crease = (a, b, op = .18) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#fff" stroke-opacity="${op}" stroke-width="2"/>`;

// unfold a group along a horizontal (dir="y") or vertical (dir="x") crease at (cx,cy)
function unfold(content, t, t0, cx, cy, dir = "y", dur = 0.55) {
  const u = outBack((t - t0) / dur);
  if (t < t0) return "";
  const sx = dir === "x" ? Math.max(0.001, u) : 1, sy = dir === "y" ? Math.max(0.001, u) : 1;
  const shade = (1 - clamp((t - t0) / dur)) * 0.35;   // half-folded paper looks darker
  return `<g transform="translate(${cx} ${cy}) scale(${sx} ${sy}) translate(${-cx} ${-cy})">${content}
    ${shade > 0.01 ? `<g opacity="${shade}" style="mix-blend-mode:multiply">${content.replace(/fill="#[0-9a-fA-F]{3,6}"/g, 'fill="#4a3b2c"')}</g>` : ""}</g>`;
}

// ---------------- pieces ----------------
function sun(t) {
  const n = 12, r = 130, cx = 790, cy = 470, rot = t * 6;
  let s = "";
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * TAU, a1 = ((i + 1) / n) * TAU;
    s += poly([[0, 0], [C(a0) * r, S(a0) * r], [C(a1) * r, S(a1) * r]], i % 2 ? "#f08a5d" : "#e8704f");
  }
  for (let i = 0; i < n; i++) {   // paper rays
    const a = (i / n) * TAU + TAU / 24, a2 = a + 0.12, a3 = a - 0.12;
    s += poly([[C(a3) * (r + 20), S(a3) * (r + 20)], [C(a) * (r + 70 + 8 * S(t * 2 + i)), S(a) * (r + 70 + 8 * S(t * 2 + i))], [C(a2) * (r + 20), S(a2) * (r + 20)]], i % 2 ? "#f4b66a" : "#f2a25a");
  }
  return `<g transform="translate(${cx} ${cy}) rotate(${rot})" filter="url(#sh)">${s}</g>`;
}
function cloud(x, y, s, dark) {
  const pts = [[-110, 20], [-80, -30], [-20, -50], [30, -70], [90, -30], [120, 20]];
  let f = "";
  for (let i = 0; i < pts.length - 1; i++) f += poly([[0, 20], pts[i], pts[i + 1]], i % 2 ? "#ffffff" : (dark ? "#e6dfd2" : "#f1ebe0"));
  return `<g transform="translate(${x} ${y}) scale(${s})" filter="url(#sh)">${f}</g>`;
}
function mountain(x, base, w, h, lit, shade, snow) {
  const L = [x - w / 2, base], R = [x + w / 2, base], P = [x + w * 0.06, base - h], M = [x + w * 0.02, base];
  let s = poly([L, P, M], lit) + poly([M, P, R], shade);
  if (snow) {
    const k = 0.28, a = [P[0] + (L[0] - P[0]) * k, P[1] + (L[1] - P[1]) * k], b = [P[0] + (M[0] - P[0]) * k, P[1] + (M[1] - P[1]) * k], c = [P[0] + (R[0] - P[0]) * k, P[1] + (R[1] - P[1]) * k];
    s += poly([a, P, b, [b[0] - 18, b[1] - 18]], "#fbf7ef") + poly([b, P, c, [b[0] + 14, b[1] - 10]], "#e4ddd0");
  }
  return s + crease(P, M, .25);
}
function pine(x, y, s) {
  return `<g transform="translate(${x} ${y}) scale(${s})">
    ${poly([[0, -120], [-48, 0], [0, 0]], "#4f9a6f")}${poly([[0, -120], [0, 0], [48, 0]], "#3a7d59")}
    ${poly([[-8, 0], [8, 0], [6, 26], [-6, 26]], "#8b5e3c")}</g>`;
}
function hillStrip(y, amp, col1, col2, phase) {
  // zig-zag folded strip
  const pts = [[-20, 1920]];
  for (let i = 0; i <= 12; i++) {
    const x = -20 + i * 95;
    pts.push([x, y + (i % 2 ? -amp : 0) + S(i + phase) * 10]);
  }
  pts.push([1100, 1920]);
  let s = poly(pts, col1);
  for (let i = 0; i < 12; i += 2) {
    const x = -20 + i * 95;
    s += poly([[x, y + S(i + phase) * 10], [x + 95, y - amp + S(i + 1 + phase) * 10], [x + 95, y + 140]], col2, 'opacity=".55"');
  }
  return `<g filter="url(#sh)">${s}</g>`;
}
function waves(t, y, col1, col2, speed, phase, amp = 46) {
  const step = 90, off = ((t * speed + phase) % step + step) % step;
  const pts = [[-200, 1980]];
  for (let i = -2; i <= 15; i++) {
    const x = i * step + off - step;
    pts.push([x, y], [x + step / 2, y - amp]);
  }
  pts.push([1300, 1980]);
  let facets = "";
  for (let i = -2; i <= 15; i++) {
    const x = i * step + off - step;
    facets += poly([[x + step / 2, y - amp], [x + step, y], [x + step / 2, y + 30]], col2, 'opacity=".6"');
  }
  return `<g filter="url(#sh)">${poly(pts, col1)}${facets}</g>`;
}
function boat(t) {
  const x = 180 + ease((t - 2.4) / 3.0) * 230 + t * 8, y = 1452 + S(t * 2.2) * 10, rot = S(t * 2.2 + .8) * 4;
  return `<g transform="translate(${x} ${y}) rotate(${rot})" filter="url(#sh)">
    ${poly([[-130, -40], [130, -40], [80, 30], [-80, 30]], "#f2c14e")}
    ${poly([[-130, -40], [0, -40], [0, 30], [-80, 30]], "#f6cf6c")}
    ${poly([[-40, -40], [0, -170], [0, -40]], "#fbf6ec")}${poly([[0, -170], [40, -40], [0, -40]], "#e3dacb")}
    ${poly([[-130, -40], [-40, -40], [-80, -100]], "#e9a93a")}${poly([[130, -40], [40, -40], [80, -100]], "#dc9a2e")}
    ${crease([0, -170], [0, 30], .35)}</g>`;
}
function crane(t, x, y, s, flapSpeed, ph, colA = "#fbf6ec", colB = "#e3d9c8", colC = "#d1c5b2") {
  const f = C(t * flapSpeed + ph);           // 1 = wings up, -1 = wings down
  const wy = -150 * f, wy2 = -130 * f;
  return `<g transform="translate(${x} ${y}) scale(${s})">
    ${poly([[-10, -12], [40, -12], [20 + 10 * f, wy2]], colC)}
    ${poly([[-60, 0], [0, -30], [60, 0]], colA)}${poly([[-60, 0], [60, 0], [0, 26]], colB)}
    ${poly([[-42, -6], [-112, -96], [-26, -14]], colA)}${poly([[-112, -96], [-138, -86], [-104, -82]], colB)}
    ${poly([[40, -6], [112, -104], [30, -16]], colB)}
    ${poly([[-26, -10], [28, -10], [-4 - 8 * f, wy]], colA)}${poly([[-26, -10], [-4 - 8 * f, wy], [-10, -10]], colB, 'opacity=".7"')}
  </g>`;
}
function fox(t) {
  const tail = S(t * 3.2) * 9, ear = Math.max(0, S(t * 1.7)) ** 10 * 14;
  const blink = (((t + .3) % 2.7) < .12) ? .15 : 1;
  return `<g transform="translate(850 1235)" filter="url(#sh)">
    <g transform="rotate(${tail} -40 -20)">
      ${poly([[-40, -20], [-190, -60], [-150, 10]], "#e9893b")}${poly([[-190, -60], [-150, 10], [-215, -10]], "#d4742a")}
      ${poly([[-190, -60], [-240, -40], [-215, -10]], "#fbf6ec")}</g>
    ${poly([[-70, 0], [0, -150], [70, 0]], "#ef9a4f")}${poly([[0, -150], [70, 0], [0, 0]], "#d97c32")}
    ${poly([[-26, 0], [0, -70], [26, 0]], "#fbf6ec")}
    <g transform="translate(0 -150)">
      <g transform="rotate(${-ear} -40 -30)">${poly([[-70, -30], [-56, -120], [-14, -50]], "#e9893b")}${poly([[-56, -120], [-40, -56], [-26, -44]], "#3b2b22")}</g>
      ${poly([[70, -30], [56, -120], [14, -50]], "#d4742a")}${poly([[56, -120], [40, -56], [26, -44]], "#3b2b22")}
      ${poly([[-80, -40], [80, -40], [0, 60]], "#ef9a4f")}${poly([[0, -40], [80, -40], [0, 60]], "#de8236")}
      ${poly([[-80, -40], [-30, 10], [0, 60]], "#fbf6ec")}${poly([[80, -40], [30, 10], [0, 60]], "#e9e1d2")}
      ${poly([[-10, 50], [10, 50], [0, 64]], "#3b2b22")}
      <ellipse cx="-30" cy="-10" rx="7" ry="${9 * blink}" fill="#3b2b22"/><ellipse cx="30" cy="-10" rx="7" ry="${9 * blink}" fill="#3b2b22"/>
    </g></g>`;
}
function title(t) {
  const u = outBack((t - 7.2) / 0.7); if (t < 7.2) return "";
  return `<g transform="translate(540 260) scale(1 ${Math.max(.001, u)})" filter="url(#sh)">
    ${poly([[-430, -110], [430, -110], [470, 20], [430, 150], [-430, 150], [-470, 20]], "#e8704f")}
    ${poly([[-430, -110], [430, -110], [430, 20], [-430, 20]], "#f08a5d")}
    ${poly([[-470, 20], [-430, -110], [-430, 150]], "#c95b3e")}${poly([[470, 20], [430, -110], [430, 150]], "#c95b3e")}
    <text x="0" y="22" text-anchor="middle" font-family="Lalezar" font-size="120" fill="#fbf6ec">عالم الأوريجامي</text>
    <text x="0" y="112" text-anchor="middle" font-family="Almarai" font-weight="800" font-size="46" fill="#fbe3c8" opacity="${clamp((t - 7.7) / .5)}">ورق مطوي… مرسوم بالكود</text>
  </g>
  `;
}

// ---------------- scene ----------------
function scene(t) {
  const drift = t * 4;
  const smallCranes = [0, 1, 2].map(i => {
    const tt = t - 3.2 - i * 0.35; if (tt < 0) return "";
    const x = -160 + tt * 170 + i * 90, y = 800 - i * 90 - tt * 22 + S(tt * 2 + i) * 14;
    return crane(t, x, y, 0.75 - i * 0.1, 9, i);
  }).join("");
  // hero crane: swoops in at 5.6s and hovers
  const hu = ease((t - 5.6) / 1.6);
  const hero = t > 5.6 ? crane(t, -400 + hu * 900 + S(t) * 10, 1060 - hu * 170 + S(t * 1.6) * 16, 2.3, 5.5, 0, "#f7d4d0", "#ebb4ae", "#dc9b95") : "";

  return `
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#3b2b1c" flood-opacity=".28"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="5"/>
      <feColorMatrix values="0 0 0 0 .4  0 0 0 0 .32  0 0 0 0 .24  0 0 0 .6 0"/>
    </filter>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e6d3"/><stop offset="1" stop-color="#f7efe2"/></linearGradient>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#skyG)"/>
  ${unfold(sun(t), t, 0.25, 790, 470, "x", 0.7)}
  ${unfold(cloud(220 + drift, 560, 1.7, false), t, 0.6, 240 + drift, 330)}
  ${unfold(cloud(900 - drift, 820, 1.2, true), t, 0.85, 880 - drift, 720)}
  ${unfold(cloud(120 + drift * .6, 960, 0.9, true), t, 1.0, 140 + drift * .6, 900)}
  ${unfold(`<g filter="url(#sh)">${mountain(250, 1120, 640, 420, "#7fb1ab", "#5c918c", true)}${mountain(830, 1120, 700, 480, "#6aa2a0", "#4a7f80", true)}${mountain(560, 1120, 520, 300, "#93c1b6", "#76a89d", false)}</g>`, t, 1.0, 540, 1120, "y", 0.65)}
  ${unfold(hillStrip(1130, 60, "#9bc47a", "#7ea961", 0), t, 1.45, 540, 1200)}
  ${unfold(`${pine(120, 1150, .8)}${pine(190, 1170, 1)}${pine(980, 1150, .9)}${pine(560, 1180, .7)}`, t, 1.75, 540, 1170)}
  ${unfold(hillStrip(1230, 50, "#86b366", "#6b9a4f", 2), t, 1.9, 540, 1300)}
  ${t > 2.3 ? fox(t) : ""}
  ${unfold(waves(t, 1400, "#5b8fbd", "#79a8d2", 30, 0), t, 2.2, 540, 1500)}
  ${t > 2.4 ? boat(t) : ""}
  ${unfold(waves(t, 1520, "#3e6b94", "#5b8fbd", -40, 30, 50), t, 2.4, 540, 1620)}
  ${unfold(waves(t, 1660, "#2f4b6e", "#3e6b94", 52, 60, 54), t, 2.6, 540, 1760)}
  ${unfold(waves(t, 1800, "#243a57", "#2f4b6e", -60, 10, 56), t, 2.8, 540, 1880)}
  ${smallCranes}
  ${hero}
  ${title(t)}
  <g stroke="#ffffff" stroke-opacity=".10" stroke-width="2.5">
    <line x1="0" y1="0" x2="1080" y2="1920"/><line x1="1080" y1="0" x2="0" y2="1920"/><line x1="540" y1="0" x2="540" y2="1920"/><line x1="0" y1="960" x2="1080" y2="960"/>
  </g>
  <rect width="${W}" height="${H}" filter="url(#grain)" opacity=".14"/>
  <rect width="${W}" height="${H}" fill="#f1e6d3" opacity="${clamp(1 - t / 0.35)}"/>`;
}

const svg = document.getElementById("stage");
window.DURATION = DURATION;
window.setTime = (t) => { svg.innerHTML = scene(t); };
setTime(Number(new URLSearchParams(location.search).get("t") || 6));
</script>
</body>
</html>
