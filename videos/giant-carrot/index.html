<!doctype html>
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- motion-designer helpers (Disney's 12 principles), used by compositions/story.html -->
    <script src="assets/motion.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f7e4a8; }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.5" data-width="1080" data-height="1920">
      <!-- picture -->
      <div id="story" data-composition-id="story" data-composition-src="compositions/story.html"
           data-start="0" data-duration="12.5" data-track-index="0" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
           data-start="0" data-duration="9" data-track-index="1" data-track-kind="captions"
           data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html"
           data-start="9" data-duration="3.5" data-track-index="2" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 3"></div>
      <!-- sound: music bed, effects, voice (Kokoro, af_heart) -->
      <audio id="music" class="clip" src="assets/music.wav" data-start="0" data-duration="12.5" data-track-index="3" data-volume="0.55"></audio>
      <audio id="sfx" class="clip" src="assets/sfx.wav" data-start="0" data-duration="12.5" data-track-index="4" data-volume="1"></audio>
      <audio id="v1" class="clip" data-duration="2.15" src="assets/voice/line1.wav" data-start="0.35" data-track-index="5" data-volume="1"></audio>
      <audio id="v2a" class="clip" data-duration="0.98" src="assets/voice/line2a.wav" data-start="3.5" data-track-index="5" data-volume="1"></audio>
      <audio id="v2b" class="clip" data-duration="0.96" src="assets/voice/line2b.wav" data-start="5.2" data-track-index="5" data-volume="1"></audio>
      <audio id="v3" class="clip" data-duration="2.2" src="assets/voice/line3.wav" data-start="6.72" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
