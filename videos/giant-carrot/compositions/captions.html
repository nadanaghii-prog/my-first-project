<template>
  <style>
    @font-face { font-family: "Lalezar"; src: url("assets/fonts/lalezar-arabic-400-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; pointer-events: none; }
    /* full-width box, text centred on the safe band's centre (x 120–888 → 504) */
    .cap { position: absolute; left: 0; width: 1008px; top: 300px; text-align: center; opacity: 0; overflow: visible; }
    .cap-card {
      display: inline-block; direction: rtl; font-family: "Lalezar", sans-serif; font-size: 78px; line-height: 1.15;
      color: #6b4a32; background: #fdf3dc; border: 6px solid #6b4a32; border-radius: 40px; padding: 14px 40px 4px;
      box-shadow: 0 8px 0 rgba(107, 74, 50, .25);
    }
    .cap-card.hot { color: #fdf3dc; background: #e2483e; font-size: 104px; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
    <div id="cap-1" class="clip cap" data-start="0.3" data-duration="1.05"><span id="cap-1-t" class="cap-card">أرنبين صغيرين</span></div>
    <div id="cap-2" class="clip cap" data-start="1.35" data-duration="1.45"><span id="cap-2-t" class="cap-card">لقوا جزرة عملاقة</span></div>
    <div id="cap-3" class="clip cap" data-start="3.45" data-duration="1.25"><span id="cap-3-t" class="cap-card">شدّوا…</span></div>
    <div id="cap-4" class="clip cap" data-start="5.1" data-duration="1.55"><span id="cap-4-t" class="cap-card">وشدّوا!</span></div>
    <div id="cap-5" class="clip cap" data-start="6.75" data-duration="0.55"><span id="cap-5-t" class="cap-card hot">بوب!</span></div>
    <div id="cap-6" class="clip cap" data-start="7.3" data-duration="0.8"><span id="cap-6-t" class="cap-card">أكبر جزرة</span></div>
    <div id="cap-7" class="clip cap" data-start="8.1" data-duration="0.85"><span id="cap-7-t" class="cap-card">في الجنينة كلها!</span></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const groups = [["#cap-1", 0.3, 1.35], ["#cap-2", 1.35, 2.8], ["#cap-3", 3.45, 4.7], ["#cap-4", 5.1, 6.65],
                    ["#cap-5", 6.75, 7.3], ["#cap-6", 7.3, 8.1], ["#cap-7", 8.1, 8.95]];
    groups.forEach(([sel, start, end]) => {
      const card = sel + "-t";
      // in: fade the group, pop the card with overshoot (anticipation-free: words arrive with the voice)
      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, start);
      tl.fromTo(card, { scale: 0.6, rotation: -3 }, { scale: 1, rotation: 0, duration: 0.32, ease: "back.out(2.4)" }, start);
      // out + hard kill so a stale group never lingers
      tl.to(sel, { opacity: 0, duration: 0.1, ease: "power2.in" }, end - 0.1);
      tl.set(sel, { opacity: 0, visibility: "hidden" }, end);
    });
    // the "Pop!" card gets an extra exaggerated punch
    tl.fromTo("#cap-5-t", { scale: 0.3 }, { scale: 1.12, duration: 0.18, ease: "back.out(4)" }, 6.75);
    tl.to("#cap-5-t", { scale: 1, duration: 0.2, ease: "power2.out" }, 6.93);
    window.__timelines["captions"] = tl;
  </script>
</template>
