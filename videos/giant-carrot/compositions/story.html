<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #f7e4a8; }
    #story-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
  <div id="root" data-composition-id="story" data-width="1080" data-height="1920">
    <svg id="story-svg" data-layout-allow-overflow viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <script>
  (function () {
  /* The Giant Carrot — storybook style (animate skill), motion by the motion-designer skill.
   * Beat sheet (voice is the clock):
   *  0.0        HOOK: two bunny kids already gripping huge carrot leaves (frame 0 = thumbnail)
   *  0.35–2.4   V1 "Two little bunnies found a giant carrot."  slow push-in, blinks, breathing
   *  3.2–4.9    PULL 1: anticipation lean-in → pull back → strain + shake → relax   V2a "They pulled..."
   *  4.9–6.75   PULL 2 (bigger): lean-in → pull → long strain, carrot creeps up    V2b "...and pulled!"
   *  6.8        KEY MOMENT  POP! carrot shoots up on an arc and spins, dirt flies (straight ahead),
   *             kids fall back and land on their bottoms (squash), camera snaps out   V3 "Pop! The biggest…"
   *  7.75       carrot lands tip-down: impact squash, wobble + leaves follow through, camera shake
   *  8.0–10     kids get up and hop for joy (different heights + timing = appeal)
   *  9.0–12.5   title (separate GSAP composition), hold to read
   */
  const { clamp, progress, ease, tween, jump, followThrough, impact, squash, blink, breathe, noise, arc, spring } = Motion;
  const W = 1080, H = 1920, GROUND = 1440, CX = 540;
  const INK = "#6b4a32", FUR = "#c9a273", FUR_L = "#f6e7cf", BLUSH = "#f39a94";
  const S = Math.sin, TAU = Math.PI * 2;
  const ink = (w = 4.5) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
  const limb = (d, w, col) =>
    `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 8}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // ---------------- key times ----------------
  const POP = 6.8, LAND = 7.75, KIDS_SIT = 7.05;
  const PULLS = [{ lean: 3.2, pull: 3.45, relax: 4.6, end: 4.9, angle: 16, strain: 0.05 },
                 { lean: 4.9, pull: 5.15, relax: 99, end: 99, angle: 24, strain: 0.09 }];

  // pull angle (degrees leaning AWAY from the carrot) — pose to pose with anticipation
  function pullAngle(t) {
    if (t >= POP) return 0;
    let a = 0;
    for (const p of PULLS) {
      if (t < p.lean) continue;
      a = tween(t, [[p.lean, 0], [p.pull, -5, "inOutSine"],               // anticipation: lean toward the carrot
                    [p.pull + 0.35, p.angle, "outBack"],                    // yank back (overshoot)
                    [p.relax, p.angle * 0.92, "inOutSine"],                 // hold the strain
                    [p.end, 2, "inOutSine"]]);                              // relax
    }
    return a;
  }
  function strainShake(t, k) {
    if (t >= POP) return 0;
    let s = 0;
    for (const p of PULLS) if (t > p.pull + 0.3 && t < Math.min(p.relax, POP)) s = p.strain * (1 + (t - p.pull) * 0.6);
    return s * noise(t * 28, k) * 60;
  }
  // carrot rise before the pop (anticipation of the big moment), then the flight (arc + spin)
  function carrotState(t) {
    if (t < POP) {
      const creep = t > 5.5 ? tween(t, [[5.5, 0], [6.6, -38, "inCubic"], [6.75, -30, "outQuad"]]) : 0;
      return { y: creep + strainShake(t, 9) * 0.1, rot: noise(t * 9, 3) * (t > 5.5 ? 3 : 0), sx: 1, sy: 1 };
    }
    if (t < LAND) {
      const up = 0.48;                                                       // timing: fast up, hangs at apex, falls
      if (t < POP + up) {
        const u = ease.outCubic(progress(t, POP, up));
        const [sx, sy] = squash(0.22 * (1 - u));                             // stretch on launch
        return { y: -40 - 820 * u, rot: 360 * ease.inOutSine(progress(t, POP, LAND - POP)), sx, sy };
      }
      const u = ease.inQuad(progress(t, POP + up, LAND - POP - up));
      const [sx, sy] = squash(0.18 * u);                                     // stretch as it falls fast
      return { y: -860 + (860 - 430) * u, rot: 360 * ease.inOutSine(progress(t, POP, LAND - POP)), sx, sy };
    }
    const [sx, sy] = impact(t, LAND, 0.28, 0.2);
    return { y: -430, rot: followThrough(t, LAND, 9, 2.2, 3.2), sx, sy };
  }

  // ---------------- background (storybook) ----------------
  function sky(t) {
    return `<rect x="-600" y="-900" width="2280" height="3700" fill="#f7e4a8"/>
      <rect x="-600" y="0" width="2280" height="1920" fill="url(#gc-sky)"/>
      <circle cx="790" cy="430" r="${290 + S(t * 1.5) * 6}" fill="url(#gc-sun)"/><circle cx="790" cy="430" r="125" fill="#fff6d6"/>
      ${cloud(150 + t * 9, 330, 1)}${cloud(980 - t * 6, 560, .7)}`;
  }
  function cloud(x, y, s) {
    return `<g transform="translate(${x} ${y}) scale(${s})" opacity=".9"><path d="M -110 30 Q -120 -10 -78 -14 Q -64 -60 -16 -48 Q 20 -84 62 -44 Q 112 -50 112 0 Q 130 30 96 34 Z" fill="#fffaf0" ${ink(4)} stroke-opacity=".5"/></g>`;
  }
  function hills() {
    return `<path d="M -600 860 L 0 860 Q 220 740 460 820 Q 660 740 860 810 Q 980 760 1080 800 L 1680 800 L 1680 1200 L -600 1200 Z" fill="#b5cd7a" ${ink(4)}/>
      ${[[200, 790], [236, 778], [900, 760], [936, 772]].map(([x, y]) => `<path d="M ${x} ${y} L ${x - 22} ${y + 70} L ${x + 22} ${y + 70} Z" fill="#6f9a48" ${ink(3.5)}/>`).join("")}
      <path d="M -600 980 L 0 980 Q 300 900 560 960 Q 820 910 1080 950 L 1680 950 L 1680 1300 L -600 1300 Z" fill="#9fc062" ${ink(4)}/>`;
  }
  function cottage(t) {
    const smoke = [0, 1, 2].map(i => { const u = (t * 0.3 + i / 3) % 1; return `<circle cx="${262 + u * 30 + S(u * 7) * 8}" cy="${770 - u * 180}" r="${10 + u * 22}" fill="#fffaf0" opacity="${(1 - u) * .7}"/>`; }).join("");
    return `<g transform="translate(-250 210) scale(.62)">${smoke.replace(/cx="([\d.]+)"/g, (m, v) => `cx="${(+v + 250) / .62 - 250}"`)}
      <rect x="828" y="430" width="48" height="110" fill="#c0694a" ${ink(4)}/>
      <path d="M 610 760 L 610 600 L 900 600 L 900 760 Z" fill="#f4e1bf" ${ink(5)}/>
      <path d="M 560 620 Q 640 470 755 420 Q 870 470 950 620 Q 755 650 560 620 Z" fill="#e8c565" ${ink(5)}/>
      <rect x="726" y="660" width="62" height="100" rx="6" fill="#a8703f" ${ink(4.5)}/>
      <rect x="640" y="660" width="44" height="44" fill="#bfe0ee" ${ink(4)}/><rect x="830" y="660" width="44" height="44" fill="#bfe0ee" ${ink(4)}/></g>`;
  }
  function appleTree(x, y, t, flip) {
    seed = Math.floor(x) + 11;
    const apples = [...Array(7)].map(() => { const ax = (rnd() - .5) * 260, ay = -390 - rnd() * 210; return `<circle cx="${ax}" cy="${ay}" r="17" fill="#e2483e" ${ink(3.5)}/><circle cx="${ax - 6}" cy="${ay - 6}" r="4" fill="#fff" opacity=".6"/>`; }).join("");
    return `<g transform="translate(${x} ${y}) scale(${flip ? -1 : 1} 1)">
      <path d="M -34 0 Q -26 -200 -40 -330 L 40 -330 Q 26 -200 34 0 Z" fill="#8a5a36" ${ink(5)}/>
      <g transform="rotate(${S(t * 1.1 + x) * 1.6} 0 -330)">
        <path d="M -180 -380 Q -210 -470 -140 -520 Q -140 -620 -40 -630 Q 30 -690 110 -620 Q 200 -610 190 -510 Q 240 -440 170 -370 Q 100 -310 0 -340 Q -110 -300 -180 -380 Z" fill="#78a84a" ${ink(5)}/>
        ${apples}</g></g>`;
  }
  function ground() {
    seed = 99;
    const tufts = [...Array(22)].map(() => { const x = rnd() * 1080, y = 1480 + rnd() * 400; return `<path d="M ${x - 10} ${y} q 2 -18 -2 -26 M ${x} ${y} q 0 -22 3 -32" fill="none" stroke="#5f8c3a" stroke-width="4" stroke-linecap="round"/>`; }).join("");
    return `<path d="M -600 1180 Q 540 1120 1680 1180 L 1680 2700 L -600 2700 Z" fill="url(#gc-grass)" ${ink(4)}/>${tufts}
      <path d="M -40 1250 Q 200 1215 420 1245 Q 200 1290 -40 1295 Z" fill="#8a5a3a" ${ink(4)}/>
      <path d="M 700 1240 Q 900 1210 1120 1240 L 1120 1290 Q 900 1285 700 1240 Z" fill="#8a5a3a" ${ink(4)}/>`;
  }
  function flower(x, y, s, col, t, ph) {
    const b = blink(t, 3.4, ph);
    const petals = [...Array(8)].map((_, i) => `<ellipse cx="0" cy="-46" rx="24" ry="34" transform="rotate(${i * 45})" fill="${col}" ${ink(4)}/>`).join("");
    return `<g transform="translate(${x} ${y}) scale(${s})">${limb("M 0 0 Q 8 80 0 220", 12, "#6f9e45")}
      <g transform="rotate(${S(t * 1.8 + ph) * 7} 0 200)">${petals}<circle r="40" fill="#f9c74f" ${ink(4)}/>
      <ellipse cx="-13" cy="-6" rx="5" ry="${Math.max(1, 7 * b)}" fill="#3b2a20"/><ellipse cx="13" cy="-6" rx="5" ry="${Math.max(1, 7 * b)}" fill="#3b2a20"/>
      <path d="M -12 10 Q 0 22 12 10" fill="none" ${ink(3.5)}/></g></g>`;
  }
  function butterfly(t, x, y, col, ph) {
    const f = Math.abs(S(t * 18 + ph));
    return `<g transform="translate(${x} ${y}) rotate(${S(t * 2 + ph) * 15})"><g transform="scale(${0.25 + f * 0.75} 1)">
      <path d="M 0 0 Q -40 -46 -44 -10 Q -46 14 0 4 Z M 0 0 Q 40 -46 44 -10 Q 46 14 0 4 Z" fill="${col}" ${ink(3.5)}/></g><path d="M 0 -10 L 0 26" ${ink(6)}/></g>`;
  }

  // ---------------- the giant carrot ----------------
  function carrot(t) {
    const c = carrotState(t);
    // leaves: overlap — they lag the body and follow through after the landing
    const leafLag = t < POP ? S(t * 2 + 1) * 4 + strainShake(t, 4) * 0.2
      : t < LAND ? -c.rot * 0.0 + 18 * Math.sin((t - POP) * 9) * Math.exp(-(t - POP) * 1.5)
      : followThrough(t, LAND, 22, 2.6, 3.4);
    const leaves = [[-48, -230, -22], [-18, -270, -8], [16, -280, 6], [46, -235, 20], [0, -200, 0]].map(([dx, h, r], i) =>
      `<g transform="rotate(${r + leafLag * (0.6 + i * 0.12)} 0 -40)">
        <path d="M 0 -40 Q ${dx * 0.4} ${h * 0.5} ${dx} ${h}" fill="none" stroke="${INK}" stroke-width="30" stroke-linecap="round"/>
        <path d="M 0 -40 Q ${dx * 0.4} ${h * 0.5} ${dx} ${h}" fill="none" stroke="#5f9e3e" stroke-width="22" stroke-linecap="round"/>
        <ellipse cx="${dx}" cy="${h}" rx="26" ry="40" transform="rotate(${r * 1.5} ${dx} ${h})" fill="#6fae48" ${ink(4)}/></g>`).join("");
    const body = `<path d="M -92 -40 Q 0 -70 92 -40 Q 96 140 30 400 Q 6 440 -4 430 Q -40 380 -92 -40 Z" fill="#f08a3c" ${ink(5)}/>
      <path d="M -60 40 l 26 6 M 40 110 l 24 4 M -40 200 l 22 6 M 30 290 l 18 4" ${ink(4)}/>
      <path d="M -70 -20 Q -60 120 -30 300" fill="none" stroke="#ffb072" stroke-width="12" stroke-linecap="round" opacity=".7"/>`;
    // pivot: carrot shoulder sits on the ground at rest; scale around the tip on landing
    return `<g transform="translate(${CX} ${GROUND + c.y}) rotate(${c.rot} 0 200) translate(0 430) scale(${c.sx} ${c.sy}) translate(0 -430)">${leaves}${body}</g>`;
  }
  function soilFront(t) {
    // the mound hides the buried carrot until the pop; after the pop it's a hole with scattered dirt
    const burst = t >= POP;
    return burst
      ? `<ellipse cx="${CX}" cy="${GROUND + 18}" rx="120" ry="30" fill="#5c3a22" ${ink(4)}/>`
      : `<path d="M ${CX - 190} ${GROUND + 40} Q ${CX - 110} ${GROUND - 30} ${CX} ${GROUND - 22} Q ${CX + 110} ${GROUND - 30} ${CX + 190} ${GROUND + 40} Z" fill="#8a5a3a" ${ink(4.5)}/>
`;
  }
  function dirt(t) {     // straight-ahead: ballistic clods from the pop
    const x = t - POP; if (x < 0 || x > 1.4) return "";
    seed = 321;
    return [...Array(16)].map(() => {
      const vx = (rnd() - .5) * 900, vy = -500 - rnd() * 700, r = 9 + rnd() * 14;
      const px = CX + vx * x, py = GROUND - 10 + vy * x + 1600 * x * x;
      if (py > GROUND + 60) return "";
      return `<circle cx="${px}" cy="${py}" r="${r}" fill="#7a4e30" ${ink(3)}/>`;
    }).join("");
  }
  function sparkles(t, x, y, t0) {
    const u = (t - t0) / 1.1; if (u < 0 || u > 1) return "";
    return [...Array(8)].map((_, i) => { const a = i / 8 * TAU, r = 60 + u * 220, s = (1 - u) * 1.3;
      return `<g transform="translate(${x + Math.cos(a) * r} ${y + Math.sin(a) * r}) scale(${s}) rotate(${u * 180})"><path d="M 0 -18 L 5 -5 L 18 0 L 5 5 L 0 18 L -5 5 L -18 0 L -5 -5 Z" fill="#ffd95a" ${ink(3)}/></g>`; }).join("");
  }

  // ---------------- bunny kids ----------------
  // side: -1 = girl on the left (pulls to the left), +1 = boy on the right
  function kid(t, side) {
    const girl = side < 0, x0 = CX + side * 205, k = girl ? 1 : 2, s = 0.8;
    const shirt = girl ? "#f4b3bf" : "#fdfdfd", bottom = girl ? "#5a8fb3" : "#9b6a3e";
    let lean = pullAngle(t) + (t < POP ? strainShake(t, k) * 0.15 : 0);   // + = away from carrot
    let x = x0, y = GROUND, sx = 1, sy = 1, sitting = 0, rot;
    // strain squash while pulling (solid drawing: keep the volume)
    if (t < POP) { const st = clamp(lean / 24) * 0.07; [sx, sy] = squash(-st); }
    // fall back at the pop: arc out and land on the bottom (impact squash), then get up
    if (t >= POP && t < 8.3) {
      const u = ease.outCubic(progress(t, POP, KIDS_SIT - POP));
      const p = arc([x0, GROUND], [x0 + side * 90, GROUND + 10], -60, u);
      x = p[0]; y = p[1];
      lean = tween(t, [[POP, 20], [KIDS_SIT, 38, "outQuad"], [8.0, 34], [8.3, 0, "inOutCubic"]]);
      sitting = tween(t, [[POP, 0], [KIDS_SIT, 1, "outQuad"], [8.0, 1], [8.3, 0, "inOutCubic"]]);
      [sx, sy] = impact(t, KIDS_SIT, 0.24, 0.16);
      if (t > 8.0) { x = tween(t, [[8.0, x0 + side * 90], [8.3, x0 + side * 60, "inOutCubic"]]); y = GROUND; }
    } else if (t >= 8.3) {
      x = x0 + side * 60;
      // celebration hops: different heights and offsets per kid (appeal, no twins)
      const hops = girl ? [[8.45, 110], [9.2, 80], [10.2, 95]] : [[8.6, 140], [9.45, 100], [10.5, 70]];
      for (const [h0, hh] of hops) { const j = jump(t, h0, { height: hh, airTime: 0.42 }); if (t >= h0 && t < h0 + 0.16 + 0.42 + 0.3) { y = GROUND - j.y; sx = j.sx; sy = j.sy; } }
    }
    rot = side * lean;
    const br = breathe(t, 0.45, 0.012, k);
    // expressions: strain = squeezed eyes, pop = wide eyes + open mouth, then happy
    const straining = t < POP && lean > 10, surprised = t >= POP && t < 7.6, happy = t >= 8.3;
    const open = blink(t, 3.0, k * 1.1);
    const look = t < POP ? -side * 7 : 0, lookY = surprised ? -10 : 0;   // eyes on the carrot / up at it
    const eye = ex => straining ? `<path d="M ${ex - 16} -385 L ${ex + 4 * -Math.sign(ex)} -378 L ${ex - 16 * -1} -371" fill="none" ${ink(5)}/>`
      : happy ? `<path d="M ${ex - 15} -380 Q ${ex} -398 ${ex + 15} -380" fill="none" ${ink(5)}/>`
      : `<ellipse cx="${ex + look}" cy="${-385 + lookY}" rx="${surprised ? 18 : 15}" ry="${Math.max(1.5, (surprised ? 24 : 20) * (surprised ? 1 : open))}" fill="#3b2a20"/>` +
        ((surprised || open > .5) ? `<circle cx="${ex + look + 5}" cy="${-392 + lookY}" r="6" fill="#fff"/>` : "");
    const mouth = straining ? `<path d="M -16 -334 Q 0 -342 16 -334" fill="none" ${ink(4.5)}/>`
      : surprised ? `<ellipse cx="0" cy="-326" rx="16" ry="20" fill="#9a4a42" ${ink(4)}/>`
      : `<path d="M -20 -334 Q 0 -300 20 -334 Z" fill="#9a4a42" ${ink(4)}/>`;
    // ears: overlap + follow-through (lag behind the lean, flop at the fall, bounce on hops)
    const earBase = side * 12 + (t < POP ? -side * lean * 0.5 : 0);
    const earFT = followThrough(t, KIDS_SIT, 26, 2.8, 3.6) + followThrough(t, POP, -18, 3, 4)
      + S(t * 2.2 + k) * 2.5;
    const ear = (es) => `<g transform="rotate(${earBase + es * 13 + earFT * (es > 0 ? 1 : .75)} ${es * 38} -440)">
      <ellipse cx="${es * 38}" cy="-540" rx="36" ry="112" fill="${FUR}" ${ink(5)}/><ellipse cx="${es * 38}" cy="-530" rx="17" ry="84" fill="#f2b0a6"/></g>`;
    // arms: reach the leaves while pulling (contact!), flail up after letting go
    const inv = (gx, gy) => {   // world point → kid local space (inverse of the kid transform)
      const a = -rot * Math.PI / 180, dx = (gx - x) / s, dy = (gy - y) / s;
      return [(dx * Math.cos(a) - dy * Math.sin(a)) / (sx * 1), (dx * Math.sin(a) + dy * Math.cos(a)) / (sy * br)];
    };
    let hands;
    if (t < POP) {
      const c = carrotState(t);
      hands = [inv(CX - side * 26, GROUND + c.y - 175), inv(CX - side * 10, GROUND + c.y - 140)];
    } else {
      const f = S((t - POP) * 14) * 30 * Math.exp(-(t - POP) * 1.2);
      hands = happy ? [[-120, -330 + S(t * 6) * 20], [120, -330 + S(t * 6 + 1) * 20]] : [[-150, -360 + f], [150, -340 - f]];
    }
    const arm = (sh, hp) => `${limb(`M ${sh[0]} ${sh[1]} Q ${(sh[0] + hp[0]) / 2} ${(sh[1] + hp[1]) / 2 + 30} ${hp[0]} ${hp[1]}`, 32, shirt)}<circle cx="${hp[0]}" cy="${hp[1]}" r="20" fill="${FUR}" ${ink(4)}/>`;
    const legs = sitting > 0.3
      ? `${limb("M -30 -60 Q -20 -20 -70 -10", 30, "#fff")}${limb("M 30 -60 Q 40 -20 -10 -6", 30, "#fff")}<ellipse cx="-80" cy="-12" rx="30" ry="20" fill="${girl ? "#e57b8f" : "#4f78ad"}" ${ink(5)}/><ellipse cx="-16" cy="-8" rx="30" ry="20" fill="${girl ? "#e57b8f" : "#4f78ad"}" ${ink(5)}/>`
      : `${limb("M -30 -60 L -32 -14", 28, "#fff")}${limb("M 30 -60 L 32 -14", 28, "#fff")}<ellipse cx="-34" cy="-4" rx="34" ry="16" fill="${girl ? "#e57b8f" : "#4f78ad"}" ${ink(5)}/><ellipse cx="34" cy="-4" rx="34" ry="16" fill="${girl ? "#e57b8f" : "#4f78ad"}" ${ink(5)}/>`;
    const shadowW = clamp(1 - (GROUND - y) / 300);
    return `<ellipse cx="${x}" cy="${GROUND + 8}" rx="${110 * (0.4 + 0.6 * shadowW)}" ry="${16 * (0.4 + 0.6 * shadowW)}" fill="#3b2414" opacity="${0.18 * shadowW + 0.05}"/>
      <g transform="translate(${x} ${y}) rotate(${rot}) scale(${s}) scale(${sx} ${sy * br})">
      ${legs}
      <path d="M -74 -272 Q 0 -292 74 -272 Q 84 -180 78 -120 L -78 -120 Q -84 -180 -74 -272 Z" fill="${shirt}" ${ink(5)}/>
      ${girl ? "" : [0, 1, 2, 3, 4].map(i => `<path d="M -78 ${-250 + i * 28} L 78 ${-250 + i * 28}" stroke="#5d86b8" stroke-width="11"/>`).join("")}
      ${girl ? `<path d="M -60 -210 L 60 -210 L 96 -54 Q 0 -40 -96 -54 Z" fill="${bottom}" ${ink(5)}/>`
             : `<path d="M -78 -124 L 78 -124 L 84 -54 L 8 -54 L 0 -84 L -8 -54 L -84 -54 Z" fill="${bottom}" ${ink(5)}/>`}
      <g transform="translate(0 40) rotate(${t < POP ? side * lean * 0.3 : S(t * 1.6 + k) * 3} 0 -330)">
        ${ear(-1)}${ear(1)}
        <path d="M -108 -372 C -110 -440 -60 -466 0 -466 C 60 -466 110 -440 108 -372 C 106 -312 62 -282 0 -282 C -62 -282 -106 -312 -108 -372 Z" fill="${FUR}" ${ink(5)}/>
        <ellipse cx="0" cy="-338" rx="58" ry="40" fill="${FUR_L}"/>
        <ellipse cx="-66" cy="-346" rx="21" ry="12" fill="${BLUSH}" opacity="${straining ? 1 : .75}"/><ellipse cx="66" cy="-346" rx="21" ry="12" fill="${BLUSH}" opacity="${straining ? 1 : .75}"/>
        ${eye(-38)}${eye(38)}
        <path d="M -10 -356 Q 0 -350 10 -356 Q 8 -344 0 -341 Q -8 -344 -10 -356 Z" fill="#e8848a" ${ink(3)}/>
        ${mouth}
        ${girl ? `<path d="M 60 -452 q 18 -22 34 -4 q 16 18 -10 26 z M 60 -452 q -2 -30 -26 -24 q -20 10 4 30 z" fill="#f06f8c" ${ink(3.5)}/>` : ""}
      </g>
      ${arm([-70, -250], hands[0])}${arm([70, -250], hands[1])}
    </g>`;
  }

  // ---------------- camera ----------------
  function camera(t) {
    // staging: slow push-in to build tension during the pulls, snap out at the pop (exaggeration), settle
    const zoom = tween(t, [[0, 1.02], [3.2, 1.05, "inOutSine"], [6.75, 1.16, "inOutSine"], [7.25, 0.97, "outBack"], [8.4, 1.0, "inOutSine"]]);
    const fy = tween(t, [[0, 1240], [6.75, 1280], [7.25, 1120, "outCubic"], [8.4, 1180, "inOutSine"]]);
    const shake = t > LAND && t < LAND + 0.4 ? followThrough(t, LAND, 14, 9, 9) : 0;
    const ss = t < POP ? strainShake(t, 5) * 0.12 : 0;
    return `translate(${540 - 540 * zoom + ss} ${960 - fy * zoom + shake}) scale(${zoom})`;
  }

  function scene(t) {
    return `<defs>
      <linearGradient id="gc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e4a8"/><stop offset=".45" stop-color="#fbf0cf"/><stop offset="1" stop-color="#f6ecc8"/></linearGradient>
      <radialGradient id="gc-sun"><stop offset="0" stop-color="#fff7da" stop-opacity=".95"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/></radialGradient>
      <linearGradient id="gc-grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7c867"/><stop offset=".5" stop-color="#93bb57"/><stop offset="1" stop-color="#7aa648"/></linearGradient>
      <clipPath id="gc-above"><rect x="-600" y="-900" width="2280" height="${GROUND + 900 + 20}"/></clipPath>
      <radialGradient id="gc-vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#3b2414" stop-opacity="0"/><stop offset="1" stop-color="#3b2414" stop-opacity=".35"/></radialGradient>
      <filter id="gc-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .2  0 0 0 .55 0"/></filter>
    </defs>
    <g transform="${camera(t)}">
      ${sky(t)}${hills()}${cottage(t)}${ground()}
      ${appleTree(70, 1230, t, false)}${appleTree(1020, 1240, t, true)}
      ${t < POP ? `<g clip-path="url(#gc-above)">${carrot(t)}</g>` : ""}
      ${soilFront(t)}
      ${kid(t, -1)}${kid(t, 1)}
      ${t >= POP ? carrot(t) : ""}
      ${dirt(t)}
      ${sparkles(t, CX, GROUND - 260, LAND)}
      ${butterfly(t, 300 + S(t * 0.7) * 160, 1000 + S(t * 1.3) * 60, "#f2a65a", 0)}
      ${butterfly(t, 860 - t * 20, 940 + S(t * 1.7) * 50, "#9db8ef", 1.3)}
      ${flower(90, 1800, 1, "#f08a6a", t, .3)}${flower(330, 1880, .85, "#f9c74f", t, 1.1)}${flower(760, 1880, .9, "#b58ad8", t, 2)}${flower(990, 1800, 1, "#f08a6a", t, 2.7)}
    </g>
    <rect width="${W}" height="${H}" fill="url(#gc-vig)"/>
    <rect width="${W}" height="${H}" filter="url(#gc-grain)" opacity=".16"/>`;
  }

  const svg = document.getElementById("story-svg");
  const renderAt = (t) => { svg.innerHTML = scene(t); };
  window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
  renderAt(0);
  // a paused timeline spanning the scene so the runtime knows its length
  const tl = gsap.timeline({ paused: true });
  tl.set({}, {}, 12.5);
  window.__timelines["story"] = tl;
  })();
  </script>
</template>
